name: Programa para Windows

on:
  push:
    branches: [main]
    paths: ['app/**', 'electron/**', 'build/**', 'package.json', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every build gets a new version (1.0.<build number>) so installed copies see it as an update.
      - id: version
        shell: bash
        run: |
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version
          echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run dist:win
      - name: Check the update files exist
        shell: bash
        run: ls dist/latest.yml dist/*.exe dist/*.exe.blockmap
      - uses: actions/upload-artifact@v4
        with:
          name: Bezaleel-Windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Bezaleel ${{ steps.version.outputs.version }}
          body: Instalador de Bezaleel para Windows. Si ya lo tienes instalado, se actualiza solo; si no, descarga el archivo .exe y ábrelo.
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          make_latest: true
